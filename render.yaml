services:
  - type: web
    name: taskflow-backend
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://taskflow-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString